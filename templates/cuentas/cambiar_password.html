{% extends 'base.html' %}

{% block titulo %}Cambiar contraseña | Hotel Paradise{% endblock %}

{% block contenido %}
<div class="cabecera-pagina">
    <div>
        <h1>Cambiar contraseña</h1>
        <p>Actualiza la contraseña de tu usuario.</p>
    </div>
    <a href="{% url 'core:dashboard' %}" class="btn btn-outline-secondary">Regresar</a>
</div>

<div class="row">
    <div class="col-md-8">
        <form method="post" novalidate>
            {% csrf_token %}
            {% include 'includes/campos_formulario.html' %}
            <button type="submit" class="btn btn-primary">Guardar contraseña</button>
        </form>
    </div>
</div>
{% endblock %}
