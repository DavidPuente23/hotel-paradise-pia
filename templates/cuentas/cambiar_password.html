{% extends 'base.html' %}

{% block titulo %}Cambiar contraseña | Hotel Paradise{% endblock %}

{% block contenido %}
<div class="cabecera-pagina">
    <div>
        <h1><i class="bi bi-key me-1"></i>Cambiar contraseña</h1>
        <p>Actualiza la contraseña de tu usuario.</p>
    </div>
    <a href="{% url 'core:dashboard' %}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Regresar
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-body p-4">
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% include 'includes/campos_formulario.html' %}
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save me-1"></i>Guardar contraseña
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
