{% extends 'base.html' %}

{% block titulo %}{{ titulo }} | Hotel Paradise{% endblock %}

{% block contenido %}
<div class="cabecera-pagina">
    <div>
        <h1>{{ titulo }}</h1>
        <p>El correo electrónico debe ser único para cada cliente.</p>
    </div>
    <a href="{% url 'clientes:lista' %}" class="btn btn-outline-secondary">Regresar</a>
</div>

<div class="row">
    <div class="col-md-8">
        <form method="post" novalidate>
            {% csrf_token %}
            {% include 'includes/campos_formulario.html' %}
            <button type="submit" class="btn btn-primary">Guardar cliente</button>
            <a href="{% url 'clientes:lista' %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
